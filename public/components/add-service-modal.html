<div id="serviceModal" class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden">
        <div class="flex justify-between items-center px-4 py-3 border-b border-gray-200">
            <h3 class="text-lg font-semibold text-gray-900">Add New Service</h3>
            <button id="closeModal" class="p-1 rounded-md hover:bg-gray-100 text-gray-400 hover:text-gray-600 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <form id="serviceForm" class="p-4 space-y-4">
            <div>
                <label for="serviceName" class="block text-sm font-medium text-gray-700 mb-1">Service Name</label>
                <input type="text" id="serviceName" name="serviceName" required
                    class="block w-full border border-gray-300 rounded-md shadow-sm text-gray-800 text-sm p-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter service name">
            </div>
            <div>
                <label for="serviceUrl" class="block text-sm font-medium text-gray-700 mb-1">Service URL</label>
                <input type="url" id="serviceUrl" name="serviceUrl" required
                    class="block w-full border border-gray-300 rounded-md shadow-sm text-gray-800 text-sm p-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter service URL">
            </div>
            <div>
                <label for="portNumber" class="block text-sm font-medium text-gray-700 mb-1">Port Number</label>
                <input type="number" id="portNumber" name="portNumber" required
                    class="block w-full border border-gray-300 rounded-md shadow-sm text-gray-800 text-sm p-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter port number">
            </div>
            <div class="flex justify-end space-x-3 pt-4">
                <button type="button" id="cancelBtn"
                    class="px-5 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    Cancel
                </button>
                <button type="submit"
                    class="px-5 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    Add Service
                </button>
            </div>
        </form>
    </div>
</div>
